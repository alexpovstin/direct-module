[project]
name = "direct-module"
version = "0.1.0"
description = "Local read-only integration with Yandex Direct"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=44",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "tzdata",
    "uvicorn>=0.34,<1",
]

[project.scripts]
direct-module = "direct_module.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["direct_module"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
